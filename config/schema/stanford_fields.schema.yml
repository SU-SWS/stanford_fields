field.widget.settings.datetime_year_only:
  type: mapping
  label: 'Year Only Date widget settings'
  mapping:
    increment:
      type: integer
      label: 'Time increments'
    date_order:
      type: string
      label: 'Date part order'
    time_type:
      type: string
      label: 'Time type'
    start:
      type: integer
      label: 'Start Year'
    end:
      type: integer
      label: 'End Year'
field.widget.settings.localist_url:
  type: mapping
  label: 'Localist URL widget settings'
  mapping:
    base_url:
      type: string
      label: 'Base URL'
    placeholder_url:
      type: string
      label: 'Placeholder URL'
    placeholder_title:
      type: string
      label: 'Placeholder title'
    select_distinct:
      type: boolean
      label: 'Select Distinct'

field.field.*.third_party.stanford_fields:
  type: config_entity
  label: "Stanford Fields third party settings"
  mapping:
    force_relative:
      type: boolean
      label: "Force relative internal links"
