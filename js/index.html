<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>Widgets</title><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"/><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ==" crossorigin="anonymous" referrerpolicy="no-referrer"/><style>body {
      font-family: 'Inter', sans-serif;
    }

    .preview {
      width: 100%;
      max-width: 1100px;
      margin: 80px auto;
      border: 1px dashed rgba(0, 0, 0, 0.2);
      position: relative;
      padding: 1rem;
    }

    .preview::before {
      content: 'WIDGET PREVIEW';
      position: absolute;
      display: block;
      top: -18px;
      font-size: 11px;
      color: rgba(0, 0, 0, 0.5);
    }
    .visually-hidden {
      display: none;
    }</style><script>window.Drupal = {behaviors: {}, t: (str) => str}
    window.once = (id, selector, context = document) => {
      const elements = typeof selector === 'string' ? Array.from(context.querySelectorAll(selector)) : Array.from(selector.length === undefined ? [selector] : selector)
      return elements.filter(el => !(el.dataset.once || '').split(' ').includes(id)).map(el => {
        el.dataset.once = ((el.dataset.once || '') + ' ' + id).trim()
        return el
      })
    }
    window.once.remove = () => []
    const optionsFor = (id) => Array.from(document.querySelectorAll(`#${id} option`)).map(o => ({value: o.value, label: o.textContent}))
    window.drupalSettings = {preactFilters: {}}
    document.addEventListener('DOMContentLoaded', () => {
      const filter = (plugin, id) => {
        drupalSettings.preactFilters[plugin] = {[id]: {id, viewId: 'dev', options: optionsFor(id)}}
      }
      filter('taxonomy_label_hierarchy', 'preact-competency-dev')
      filter('preact_combo_box', 'preact-content-type-dev')
      filter('taxonomy_label_hierarchy_checkbox', 'preact-topic-dev')
    }, {once: true})</script><link rel="stylesheet" href="/preact-combobox.css"/><script defer="defer" src="/islands/shared-runtime.island.js"></script><script defer="defer" src="/islands/shared-preact.island.js"></script><script defer="defer" src="/islands/shared-select-list.island.js"></script><script defer="defer" src="/islands/select-list-filters.island.js"></script><script defer="defer" src="/islands/hierarchy-label-select-lists.island.js"></script><script defer="defer" src="/islands/hierarchy-label-checkboxes.island.js"></script></head><body><div class="preview"><form class="views-exposed-form bef-exposed-form" data-bef-auto-submit-full-form action="#" id="views-exposed-form-dev"><div id="preact-competency-dev" class="preact-filter taxonomy-label-hierarchy"><div class="form-item form-type-select"><label for="edit-competency">Filter by competency (hierarchy select)</label> <select id="edit-competency" name="competency[]" multiple="multiple" class="form-select"><option value="1111">Communication</option><option value="1116" disabled="disabled">-Writing</option><option value="1181">-Speaking &amp; presenting</option><option value="1236" selected="selected">-Interpersonal communication</option><option value="1186">Teaching and Mentoring</option><option value="1246">-Pedagogy &amp; assessment</option><option value="1191">-Mentoring</option></select></div></div><div id="preact-content-type-dev" class="preact-filter preact-combo-box"><div class="form-item form-type-select"><label for="edit-content-type">Filter by learning opportunity (combobox)</label> <select id="edit-content-type" name="content_type" class="form-select"><option value="All" selected="selected">- Any -</option><option value="1">Event</option><option value="2" disabled="disabled">Resource</option></select></div></div><div id="preact-topic-dev" class="preact-filter taxonomy-label-hierarchy-checkbox"><div class="form-item form-type-select"><label for="edit-topic">Filter by topic (hierarchy radios)</label> <select id="edit-topic" name="topic[]" multiple="multiple" class="form-select"><option value="1081">Professionalism</option><option value="1121">-Academic &amp; research integrity</option><option value="1086" selected="selected">-Stress management</option><option value="1271">Leadership &amp; Management</option><option value="1071">-Negotiation</option><option value="1076">-Innovation</option></select></div></div><div class="form-actions"><input type="submit" value="Apply filter" class="button js-form-submit form-submit" data-bef-auto-submit-click></div></form></div><script>// Mimic the Drupal & BEF bits the islands rely on. Changes are logged
  // instead of submitting the form.
  document.querySelector('form').addEventListener('change', (e) => {
    console.log('change', e.target.name, Array.from(e.target.selectedOptions || []).map(o => o.value))
  })
  document.addEventListener('DOMContentLoaded', () => {
    Object.values(Drupal.behaviors).forEach(behavior => behavior.attach && behavior.attach(document, drupalSettings))
  })</script></body></html>
